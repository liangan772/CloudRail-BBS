# CloudRail Forum 单容器进程编排（supervisord）
# 由 entrypoint.sh 初始化后以 root 运行；各程序按需 setuid 非 root 用户。

[supervisord]
nodaemon=true
logfile=/tmp/supervisord.log
pidfile=/tmp/supervisord.pid
childlogdir=/tmp

[program:postgres]
# PostgreSQL（数据 /data/postgres，仅监听容器内 127.0.0.1）
command=/usr/lib/postgresql/15/bin/postgres -D /data/postgres -c listen_addresses=127.0.0.1 -c port=5432 -c unix_socket_directories=/run/postgresql
user=postgres
autostart=true
autorestart=true
priority=100
stdout_logfile=/tmp/postgres.log
stderr_logfile=/tmp/postgres.err.log

[program:redis]
# Redis（数据 /data/redis，仅监听容器内 127.0.0.1）
command=redis-server /etc/forum-redis.conf
user=redis
autostart=true
autorestart=true
priority=90
stdout_logfile=/tmp/redis.log
stderr_logfile=/tmp/redis.err.log

[program:nginx]
# 前端静态 + /api 反代（非 root，监听 8080）
command=nginx -g 'daemon off;'
user=forum
autostart=true
autorestart=true
priority=80
stdout_logfile=/tmp/nginx.log
stderr_logfile=/tmp/nginx.err.log

[program:uvicorn]
# FastAPI 后端（先于 celery 启动，依赖 postgres/redis）
command=uvicorn app.main:app --host 0.0.0.0 --port 8000
user=forum
directory=/app
environment=PYTHONUNBUFFERED="1"
autostart=true
autorestart=true
priority=70
stdout_logfile=/tmp/uvicorn.log
stderr_logfile=/tmp/uvicorn.err.log

[program:celery]
# AI 审核异步任务（broker/backend = 容器内 Redis）
command=celery -A app.tasks.celery_app:celery_app worker --loglevel=info --concurrency=2
user=forum
directory=/app
autostart=true
autorestart=true
priority=60
startsecs=10
stdout_logfile=/tmp/celery.log
stderr_logfile=/tmp/celery.err.log
