# CloudRail Forum Nginx 配置（合并镜像内使用，非 root 运行）
# 安全加固（v0.1.0）：安全响应头、容器内 8080（非特权端口）、临时目录 /tmp
server {
    listen 8080;
    server_name _;

    # ---- 安全响应头 ----
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # CSP：仅同源脚本/样式/接口；允许内联样式（Element Plus）与 data: 图片（验证码）
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # ---- 前端静态资源（SPA history 路由） ----
    root /usr/share/nginx/html;
    index index.html;
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API 反向代理（同容器内 FastAPI）
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 上传文件（挂载卷 /data/uploads 时生效）
    location /uploads/ {
        alias /data/uploads/;
    }

    # 静态资源长缓存（构建产物带 hash）
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # 上传大小限制（图片 10MB）
    client_max_body_size 10m;

    # 非 root 运行所需（可写路径均在 /tmp）
    pid /tmp/nginx.pid;
    client_body_temp_path /tmp/nginx-client-body;
    proxy_temp_path /tmp/nginx-proxy;
    fastcgi_temp_path /tmp/nginx-fastcgi;
    uwsgi_temp_path /tmp/nginx-uwsgi;
    scgi_temp_path /tmp/nginx-scgi;
}
