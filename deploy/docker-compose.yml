# 开发/演示环境编排（生产部署请参考 docs/开发文档.md 第 10 章）
# 用法：docker compose -f deploy/docker-compose.yml up -d --build
#
# 镜像策略：前后端合并为单一镜像（根目录 Dockerfile），
# 一个容器内 Nginx 托管前端静态资源并反代 /api 到本地 FastAPI；
# worker / beat 复用同一镜像，仅以 command 覆盖默认启动命令。

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: forum
      POSTGRES_USER: forum
      POSTGRES_PASSWORD: ${PG_PASSWORD:-forum}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forum -d forum"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 合并镜像：前端 + 后端 API（Nginx :80 + FastAPI :8000 容器内）
  backend:
    build:
      context: ..
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://forum:${PG_PASSWORD:-forum}@postgres:5432/forum
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-dev-only-secret-key-change-me}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "80:80"        # 前端页面 + /api（经 Nginx 反代）
      # - "8000:8000"  # 需要直连 FastAPI（绕过 Nginx）时取消注释

  worker:
    build:
      context: ..
      dockerfile: Dockerfile
    command: sh -c "celery -A app.tasks.celery_app:celery_app worker --loglevel=info"
    environment:
      DATABASE_URL: postgresql+asyncpg://forum:${PG_PASSWORD:-forum}@postgres:5432/forum
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-dev-only-secret-key-change-me}
    depends_on:
      - backend

  beat:
    build:
      context: ..
      dockerfile: Dockerfile
    command: sh -c "celery -A app.tasks.celery_app:celery_app beat --loglevel=info"
    environment:
      DATABASE_URL: postgresql+asyncpg://forum:${PG_PASSWORD:-forum}@postgres:5432/forum
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-dev-only-secret-key-change-me}
    depends_on:
      - backend

volumes:
  pgdata:
  redisdata:
