# CloudRail Forum 单容器部署（v1.5）
# 用法：docker compose -f deploy/docker-compose.yml up -d --build
# 仅一个容器：Nginx（前端 + /api 反代）+ FastAPI；SQLite 卷持久化；
# 缓存/限流内存降级；AI 审核用进程内后台任务（无需 Redis/Celery/PostgreSQL）。

services:
  forum:
    build:
      context: ..
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: sqlite+aiosqlite:////data/forum.db
      REDIS_URL: ${REDIS_URL:-redis://127.0.0.1:6379/0}
      UPLOAD_DIR: /data/uploads
      SECRET_KEY: ${SECRET_KEY:-dev-only-secret-key-change-me}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost}
      AI_ENABLED: ${AI_ENABLED:-false}
      AI_BASE_URL: ${AI_BASE_URL:-https://api.deepseek.com/v1}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-deepseek-chat}
      AI_VISION_MODEL: ${AI_VISION_MODEL:-}
      AI_MODE: ${AI_MODE:-llm}
      AI_AUDIT_MODE: ${AI_AUDIT_MODE:-async}
    volumes:
      - forumdata:/data
    ports:
      - "80:8080"
    restart: unless-stopped
    healthcheck:
      # 直连容器内 FastAPI（/health 经 Nginx 会被 SPA fallback 误报 200）
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    mem_limit: 512m
    cpus: 1.0

volumes:
  forumdata:
