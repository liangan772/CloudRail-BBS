name: Docker Image CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the combined image
        run: docker build . --tag forum:ci

  # 依赖安全扫描（信息性：发现高危漏洞时输出但不阻断）
  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: npm audit (frontend)
        working-directory: frontend
        run: |
          npm install --no-audit --no-fund --omit=dev || true
          npm audit --omit=dev --audit-level=high || echo "::warning::npm audit 发现高危漏洞，请检查 frontend/package.json"
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: pip-audit (backend)
        run: |
          pip install pip-audit
          pip-audit -r <(sed -n '/\[project\]/,/^\[/p' backend/pyproject.toml | grep -E '^    \"' | tr -d ' ",') || echo "::warning::pip-audit 发现漏洞，请检查 backend/pyproject.toml"
