name: Release

# 发行工作流：推送 v*.*.* 标签时，自动构建并发布压缩包到 GitHub Release
# 压缩包使用 GitHub 官方工件认证（actions/attest，SLSA 构建出处证明，OIDC 签名），
# 下载后可验证：
#   gh attestation verify forum-v0.1.0.zip --repo liangan772/CloudRail-BBS
# 用法：git tag v0.1.0 && git push origin v0.1.0

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  id-token: write          # OIDC 身份令牌（签名材料）
  attestations: write      # 持久化工件认证（attestation）
  artifact-metadata: write # 工件存储记录（actions/attest 官方要求）

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install --no-audit --no-fund

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Package release archives (zip + tar.gz)
        run: python scripts/package_release.py --no-build

      # GitHub 官方工件认证：对发行包生成 SLSA 构建出处证明（actions/attest@v4，
      # 默认 Provenance 模式，Sigstore 签发可验证证书，上传至 GH attestations API）
      - name: Attest build provenance (sign archives)
        uses: actions/attest@v4
        with:
          subject-path: |
            release/*.zip
            release/*.tar.gz

      - name: Create GitHub Release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.zip
            release/*.tar.gz
          generate_release_notes: true
